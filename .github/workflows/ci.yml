name: CI

# Note: This workflow runs lint, unit tests, and a fixture-based quality gate.
# Real model evaluation (Qwen3-4B, ~7GB) requires GPU and is run locally.
# The quality-gate job validates gate logic against known-passing fixtures.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy src

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest
        run: uv run pytest -q --cov-fail-under=80

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Quality gate (fixture pass)
        run: >
          uv run python scripts/quality_gate.py
          --results tests/fixtures/sample_results_pass.json
          --criteria docs/acceptance_criteria.md
