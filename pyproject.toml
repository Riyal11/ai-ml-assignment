[project]
name = "docextract"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "jsonschema>=4.22.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "transformers>=4.46.0",
    "torch>=2.3",
    "peft>=0.12",
    "trl>=0.10",
    "bitsandbytes>=0.43",
    "datasets>=3.0",
    "mlflow>=2.15",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "black",
    "bandit",
    "pre-commit",
    "types-jsonschema",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-v --cov=docextract --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
targets = ["src"]
